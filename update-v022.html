<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まなびカードバトル 更新</title>
  <style>body{font-family:sans-serif;background:#101426;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:520px;padding:28px;border-radius:20px;background:#1b2140;text-align:center}small{color:#bfc7e8}</style>
</head>
<body>
  <div class="box"><h1>更新しています</h1><p id="msg">旧キャッシュを削除しています…</p><small>完了すると自動でゲーム画面へ移動します。</small></div>
  <script>
    (async()=>{
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        document.getElementById('msg').textContent='更新準備が完了しました。';
      } catch(e) {
        document.getElementById('msg').textContent='キャッシュ削除を続行できなかったため、そのまま最新版を開きます。';
      }
      location.replace('./?v=0.2.2');
    })();
  </script>
</body>
</html>
